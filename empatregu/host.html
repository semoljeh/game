<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b27}
main{min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,4vw,38px)}.room{background:#fff;padding:10px 16px;border-radius:14px;font-weight:900;box-shadow:0 5px 20px #0001}

.team{background:#fff;border-radius:22px;padding:14px;text-align:center;border:5px solid transparent;transition:.15s;box-shadow:0 8px 20px #0001}
.num{height:110px;border-radius:18px;display:grid;place-items:center;font-size:60px;font-weight:1000;color:#fff}
.t1 .num{background:#ef4444}.t2 .num{background:#3b82f6}.t3 .num{background:#22c55e}.t4 .num{background:#f59e0b}
.team.win{border-color:#111;transform:scale(1.04);box-shadow:0 0 0 7px #fff,0 0 30px #facc15}
.team.eliminated{opacity:.42;filter:grayscale(.8);position:relative}

.score{font-size:30px;font-weight:1000;margin-top:8px}.label{font-weight:800}
.status{text-align:center;font-size:clamp(17px,2.5vw,25px);font-weight:900;min-height:34px}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
button{border:0;border-radius:13px;padding:12px 16px;font-weight:900;font-size:15px;cursor:pointer}
.primary{background:#176b39;color:#fff}.gold{background:#f59e0b;color:#fff}.good{background:#16a34a;color:#fff}.bad{background:#dc2626;color:#fff}.blue{background:#2563eb;color:#fff}
.small{padding:7px 10px;font-size:12px}.scorectl{margin-top:7px;display:flex;justify-content:center;gap:5px}

.lobby-info{margin-top:14px;color:#61746a;font-size:clamp(14px,2vw,19px);font-weight:800}
.team.connected{border:3px solid #20a653!important;box-shadow:0 0 0 5px #e9f9ee,0 10px 28px rgba(32,166,83,.18)!important}
.team.connected .num{animation:connectedPulse 1.4s infinite}
@keyframes connectedPulse{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.18);transform:scale(1.025)}}
.team.testflash .num{animation:testFlash .22s 4}
@keyframes testFlash{50%{filter:brightness(1.6);transform:scale(1.08);box-shadow:0 0 30px #fff,0 0 45px currentColor}}
.startquiz{background:#7a8790;color:#fff}
.startquiz.ready{background:#7c3aed;box-shadow:0 3px 0 #5521a7}
.startquiz:disabled{cursor:not-allowed;opacity:.55}
body.quiz-started .team.connected .num{animation:none}
@media(max-width:760px){.lobby-info{font-size:13px}}

let room="", winner=null, current=null, qIndex=-1, scores={1:0,2:0,3:0,4:0}, mode="idle", connected={};
function code(){return String(Math.floor(1000+Math.random()*9000))}

function openBuzzerPage(){
 if(!room)return alert("Buat room terlebih dahulu.");
 const url=new URL("buzzer.html",window.location.href);
 url.searchParams.set("room",room);
 window.open(url.toString(),"_blank");
}

async function createRoom(){
 if(!window.FB)return;
 room=code(); winner=null; scores={1:0,2:0,3:0,4:0}; mode="lobby"; connected={};
 await FB.set(FB.ref(FB.db,"quiz4/"+room),{
   mode:"lobby",
   buzzer:{open:false,winner:null,excluded:{}},
   connected:{},
   pressed:{1:false,2:false,3:false,4:false},
   scores,
   createdAt:Date.now()
 });
 document.getElementById("roomCode").textContent=room;
 document.getElementById("q").innerHTML='Masukkan kode <b style="color:#7c3aed;font-size:1.2em">'+room+'</b> di HP buzzer';
 document.getElementById("lobbyInfo").innerHTML='Pilih nomor regu yang masih kosong. Setelah terhubung, tekan angka di HP untuk <b>tes koneksi</b>.';
 document.getElementById("answer").style.display="none";
 const sb=document.getElementById("startBtn");sb.disabled=true;sb.classList.remove("ready");
 listen();
}
function listen(){
 FB.onValue(FB.ref(FB.db,"quiz4/"+room),snap=>{
  const d=snap.val()||{};
  mode=d.mode||"lobby"; winner=d.buzzer?.winner??null; scores=d.scores||scores; connected=d.connected||{};
  const excluded=d.buzzer?.excluded||{};
  for(let i=1;i<=4;i++){
    const card=document.getElementById("team"+i);
    document.getElementById("s"+i).textContent=scores[i]||0;
    card.classList.toggle("connected",connected[i]===true && mode==="lobby");
    card.classList.toggle("win",Number(winner)===i && mode==="quiz");
    card.classList.toggle("eliminated",excluded[i]===true && mode==="quiz");
  }

  if(mode==="lobby"){
    document.body.classList.remove("quiz-started");
    const count=[1,2,3,4].filter(i=>connected[i]===true).length;
    document.getElementById("status").textContent=count===4
      ?"✅ SEMUA REGU TERHUBUNG — SILAKAN TES TOMBOL / MULAI QUIZ"
      :"📱 MENUNGGU REGU — "+count+"/4 TERHUBUNG";
    const sb=document.getElementById("startBtn");
    sb.disabled=count!==4; sb.classList.toggle("ready",count===4);

    const pressed=d.pressed||{};
    for(let i=1;i<=4;i++){
      document.getElementById("team"+i).classList.toggle("testpressed",pressed[i]===true);
    }
    return;
  }

  document.body.classList.add("quiz-started");
  for(let i=1;i<=4;i++)document.getElementById("team"+i).classList.remove("testpressed");
  const left=[1,2,3,4].filter(i=>excluded[i]!==true);
  document.getElementById("status").textContent=winner
    ?("⚡ REGU "+winner+" PALING CEPAT!")
    :((d.buzzer?.open)?"🟢 BUZZER AKTIF — REGU "+left.join(", ")+" SILAKAN BEREBUT!":"🔒 BUZZER TERKUNCI");
 });
}
async function startQuiz(){
 if(!room)return alert("Buat room dahulu.");
 const snap=await FB.get(FB.ref(FB.db,"quiz4/"+room+"/connected"));
 const c=snap.val()||{};
 if(![1,2,3,4].every(i=>c[i]===true))return alert("Semua 4 regu harus terhubung dahulu.");
 await FB.update(FB.ref(FB.db,"quiz4/"+room),{"mode":"quiz","buzzer/open":false,"buzzer/winner":null,"buzzer/excluded":{},"pressed/1":false,"pressed/2":false,"pressed/3":false,"pressed/4":false});
 qIndex=-1;
 await nextQuestion();
}
async function nextQuestion(){
 if(!room)return alert("Buat room dahulu.");
 if(mode!=="quiz")return alert("Hubungkan semua regu lalu tekan MULAI QUIZ.");
 qIndex=(qIndex+1)%bankSoal.length; current=bankSoal[qIndex];
 document.getElementById("q").textContent=current.q;
 const li=document.getElementById("lobbyInfo"); if(li)li.textContent="";
 document.getElementById("answer").style.display="none";
 document.getElementById("answer").innerHTML="<span style=\"font-size:11px;letter-spacing:1px;display:block;color:#9a6b00;margin-bottom:3px\">JAWABAN</span>"+current.ans;
 await FB.update(FB.ref(FB.db,"quiz4/"+room+"/buzzer"),{open:true,winner:null,excluded:{},openedAt:Date.now()});
}
function showAnswer(){if(mode!=="quiz")return;if(current)document.getElementById("answer").style.display="block"}
async function openBuzzer(){
 if(!room)return;
 if(mode!=="quiz")return alert("Quiz belum dimulai.");
 winner=null;
 await FB.update(FB.ref(FB.db,"quiz4/"+room+"/buzzer"),{open:true,winner:null,openedAt:Date.now()});
}
async function markCorrect(){
 if(mode!=="quiz")return;
 if(!winner)return alert("Belum ada regu yang menekan buzzer.");
 const n=Number(winner), val=(Number(scores[n])||0)+10;
 await FB.update(FB.ref(FB.db,"quiz4/"+room),{["scores/"+n]:val,"buzzer/open":false});
}
async function markWrong(){
 if(mode!=="quiz")return;
 if(!winner)return alert("Belum ada regu yang menekan buzzer.");
 const n=Number(winner);
 const snap=await FB.get(FB.ref(FB.db,"quiz4/"+room+"/buzzer"));
 const b=snap.val()||{};
 const excluded={...(b.excluded||{}),[n]:true};
 const remaining=[1,2,3,4].filter(i=>excluded[i]!==true);
 if(remaining.length===0){
   await FB.set(FB.ref(FB.db,"quiz4/"+room+"/buzzer"),{...b,open:false,winner:null,excluded});
   document.getElementById("status").textContent="⛔ SEMUA REGU SUDAH SALAH — LIHAT JAWABAN / LANJUT SOAL";
 }else{
   await FB.set(FB.ref(FB.db,"quiz4/"+room+"/buzzer"),{...b,open:true,winner:null,excluded,openedAt:Date.now()});
 }
}
async function adjust(n,delta){
 if(!room)return; const val=Math.max(0,(Number(scores[n])||0)+delta);
 await FB.set(FB.ref(FB.db,"quiz4/"+room+"/scores/"+n),val);
}
window.openBuzzerPage=openBuzzerPage;window.createRoom=createRoom;window.startQuiz=startQuiz;window.nextQuestion=nextQuestion;window.showAnswer=showAnswer;window.openBuzzer=openBuzzer;window.markCorrect=markCorrect;window.markWrong=markWrong;window.adjust=adjust;
