<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- --- META TAGS DASAR --- -->
<title>MADASA - Tangkap Balon Hijaiyah</title>
<meta name="description" content="Game edukasi Islam untuk anak TK/RA. Mari belajar huruf hijaiyah dengan menangkap balon!">

<!-- --- GOOGLE FONTS --- -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

<style>
  /* --- PENGATURAN DASAR --- */
  html, body { 
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Nunito', 'Segoe UI', sans-serif; 
    background: linear-gradient(to bottom, #4fc3f7 0%, #e1f5fe 100%); 
    color: #333; overflow: hidden; touch-action: manipulation; 
    -webkit-touch-callout: none; -webkit-user-select: none;
    user-select: none;
  }

  /* Efek Getar Saat Salah */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-2deg); }
    75% { transform: translateX(10px) rotate(2deg); }
  }
  .shake-screen { animation: shake 0.3s ease-in-out; }

  /* --- PEMANDANGAN ALAM --- */
  #scenery { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
  .sun { position: absolute; top: -20px; right: -20px; width: 110px; height: 110px; background: #FFEB3B; border-radius: 50%; box-shadow: 0 0 40px #FF9800, 0 0 80px #FFEB3B; animation: pulseSun 4s infinite alternate; }
  @keyframes pulseSun { 0% { transform: scale(1); box-shadow: 0 0 30px #FF9800, 0 0 60px #FFEB3B; } 100% { transform: scale(1.1); box-shadow: 0 0 50px #FF9800, 0 0 100px #FFEB3B; } }
  .cloud { position: absolute; background: #fff; border-radius: 100px; width: 160px; height: 50px; opacity: 0.6; }
  .cloud::after { content: ''; position: absolute; background: #fff; width: 70px; height: 70px; border-radius: 50%; top: -30px; left: 25px; }
  .cloud::before { content: ''; position: absolute; background: #fff; width: 90px; height: 90px; border-radius: 50%; top: -45px; right: 25px; }
  .c1 { top: 40%; left: 5%; opacity: 0.4; }
  .c2 { top: 55%; right: 10%; transform: scale(0.7); opacity: 0.4; }
  .hill { position: absolute; border-radius: 50%; }
  .hill-back { width: 150%; height: 35vh; left: -25%; bottom: -15vh; background: #558B2F; }
  .hill-middle { width: 120%; height: 30vh; right: -10%; bottom: -10vh; background: #7CB342; }
  .hill-front { width: 140%; height: 25vh; left: -10%; bottom: -5vh; background: #8BC34A; }

  /* --- UI ATAS --- */
  #top-bar { position: absolute; top: 2vh; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; padding: 0 4vw; box-sizing: border-box; }
  .ui-box { background: rgba(255, 255, 255, 0.95); padding: 1vh 3vw; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-size: clamp(16px, 4vmin, 24px); font-weight: 900; border: 3px solid #FFD700; color: #ff8c00; }
  #target-container { display: flex; flex-direction: column; align-items: center; background: #fff; padding: 1vh 4vw 2vh 4vw; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border: 4px solid #4CAF50; animation: pulseTarget 2s infinite; margin: 0 10px; cursor: pointer;}
  #target-text { font-size: 18px; color: #666; margin-bottom: 5px; font-weight: 800; white-space: nowrap; }
  #target-letter { font-size: clamp(45px, 12vmin, 85px); font-weight: 900; color: #E91E63; line-height: 1.2; }
  @keyframes pulseTarget { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* --- AREA PERMAINAN --- */
  #game-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; overflow: hidden; }

  /* --- BALON --- */
  .balloon { position: absolute; bottom: -150px; width: clamp(70px, 15vmin, 100px); height: clamp(90px, 18.75vmin, 125px); background-color: var(--b-color); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; display: flex; justify-content: center; align-items: center; font-size: clamp(40px, 8vmin, 60px); color: white; font-weight: 900; cursor: pointer; box-shadow: inset -8px -8px 15px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1); animation: floatUp linear forwards; z-index: 10; padding-bottom: 12px; box-sizing: border-box; }
  .balloon::before { content: ''; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--b-color); }
  .balloon::after { content: ''; position: absolute; bottom: -45px; left: 50%; width: 2px; height: 35px; background: rgba(0,0,0,0.2); }
  .balloon:active { transform: scale(0.9); filter: brightness(1.2); }
  @keyframes floatUp { 0% { bottom: -150px; transform: translateX(0) rotate(0deg); } 50% { transform: translateX(10px) rotate(3deg); } 100% { bottom: 110vh; transform: translateX(-10px) rotate(-3deg); } }

  /* --- ANIMASI POP --- */
  .pop-anim { position: absolute; font-size: 35px; font-weight: 900; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; pointer-events: none; z-index: 20; animation: popUp 1s ease-out forwards; }
  @keyframes popUp { 0% { transform: scale(0.5); opacity: 1; } 50% { transform: scale(1.5) translateY(-30px); opacity: 1; } 100% { transform: scale(1) translateY(-60px); opacity: 0; } }

  /* --- LAYAR MENU & HASIL --- */
  .screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px; box-sizing: border-box; }
  h1 { font-size: 40px; color: #4CAF50; margin: 0 0 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); font-weight: 900; }
  h2 { font-size: 22px; color: #E91E63; margin: 0 0 20px 0; font-weight: 800; }
  p { font-size: 18px; max-width: 600px; color: #555; line-height: 1.5; margin-bottom: 25px; font-weight: 700; }
  .btn { padding: 15px 40px; font-size: 24px; font-weight: 900; background-color: #FF9800; color: white; border: 5px solid #FFF; border-radius: 40px; cursor: pointer; box-shadow: 0 8px 0 #E65100, 0 15px 20px rgba(0,0,0,0.3); transition: 0.1s; margin-bottom: 10px; }
  .btn:active { transform: translateY(8px); box-shadow: 0 0 0; }
  
  /* Lencana Developer */
  .dev-link { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 6px 20px; font-size: 14px; color: #555; text-decoration: none; background: rgba(255, 255, 255, 0.9); border: 2px solid #FFD700; border-radius: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); white-space: nowrap; z-index: 60; font-weight: 700; }
  .dev-link strong { color: #FF9800; font-weight: 900; margin-left: 4px; }

  /* KONTROL ROTASI */
  #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.4s ease; transform-origin: center center; overflow: hidden; }
  .layar-diputar { transform: rotate(90deg); width: 100vh !important; height: 100vw !important; top: 50% !important; left: 50% !important; margin-top: -50vw !important; margin-left: -50vh !important; }

  /* RESPONSIVE */
  @media (max-width: 650px) {
    #target-text { font-size: 12px; } .sun { width: 75px; height: 75px; right: -10px; top: -10px; }
    h1 { font-size: 30px; } h2 { font-size: 16px; } p { font-size: 14px; }
    .btn { font-size: 18px; padding: 10px 25px; border-width: 3px; }
    .dev-link { bottom: 15px; font-size: 10px; } .dev-link strong { font-size: 12px; }
  }
  @media (orientation: landscape) and (max-height: 600px) {
    #top-bar { top: 10px; padding: 0 15px; } #target-container { flex-direction: row; gap: 15px; padding: 5px 25px; }
    #target-text { font-size: 14px; margin-bottom: 0; } #target-letter { font-size: 40px; }
    .btn { padding: 8px 20px; font-size: 16px; border-width: 3px;}
  }
</style>
</head>

<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" onpaste="return false;">

<div id="app-container">

<!-- BACKGROUND -->
<div id="scenery">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hill hill-back"></div><div class="hill hill-middle"></div><div class="hill hill-front"></div>
</div>

<!-- Layar Sambutan -->
<div id="welcome-screen" class="screen" style="display: flex;">
  <h1>🎈 Balon Hijaiyah 🎈</h1>
  <h2>Bermain & Belajar bersama MADASA!</h2>
  <p>Tangkap balon yang hurufnya sama dengan yang diminta ya! Jangan sampai salah tangkap.</p>
  <button class="btn" onclick="startGame()">▶️ MAIN SEKARANG</button>
  <button class="btn" style="background: #9C27B0; box-shadow: 0 8px 0 #7B1FA2;" onclick="putarLayar()">🔄 PUTAR LAYAR</button>
  <a href="https://www.tiktok.com/@aromkobama" target="_blank" class="dev-link">Development <strong>Arom Kobama 😎</strong></a>
</div>

<!-- Layar Permainan -->
<div id="top-bar" style="display: none;">
  <div class="ui-box">⏱️ <span id="time-display">60</span>s<br><span style="font-size:.58em">LEVEL <span id="level-display">1</span></span></div>
  <!-- Ditambahkan onclick agar huruf bisa dipencet manual untuk mengulang suara -->
<div id="target-container" onclick="putarSuaraHuruf(currentTarget)">
    <div id="target-text">Tangkap Huruf:</div>
    <div id="target-letter">ا</div>
  </div>
  <div class="ui-box">⭐ <span id="score-display">0</span><br><span style="font-size:.58em">BENAR <span id="correct-display">0</span>/10</span></div>
</div>

<div id="game-area"></div>

<!-- Layar Hasil Akhir -->
<div id="result-screen" class="screen">
  <h1 id="result-title">Hebat! 🎉</h1>
  <p id="result-message">Waktu habis!</p>
  <div class="ui-box" style="margin-bottom: 20px; font-size: 30px; padding: 15px 40px; border-width: 4px;">
    Total Skor: <span id="final-score" style="color: #E91E63; font-size: 40px;">0</span> ⭐
  </div>
  <button id="result-main-btn" class="btn" onclick="handleResultButton()">▶️ LEVEL BERIKUTNYA</button>
  <button class="btn" style="background: #607D8B; box-shadow: 0 8px 0 #37474F;" onclick="resetLevel()">↺ RESET LEVEL</button>
</div>

</div>

<!-- MUSIK LATAR -->
<audio id="bg-music" loop>
  <source src="asset/lucu.mp3" type="audio/mpeg">
</audio>

<script>
  function putarLayar() { document.getElementById('app-container').classList.toggle('layar-diputar'); }

  const hurufHijaiyah = ['ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'و', 'ه', 'ي'];
  const balloonColors = ['#F44336', '#9C27B0', '#3F51B5', '#03A9F4', '#4CAF50', '#8BC34A', '#FFEB3B', '#FF9800', '#FF5722'];
  const pujianBenar = ["Pintar!", "Hebat!", "Bagus!", "Horeee!"];

  // --- DATABASE NAMA FILE SUARA HURUF ---
  // Pastikan Anda menaruh file misal: asset/suara/alif.mp3
  const namaFileHuruf = {
    'ا': 'alif', 'ب': 'ba', 'ت': 'ta', 'ث': 'tsa', 'ج': 'jim', 'ح': 'ha', 'خ': 'kha',
    'د': 'dal', 'ذ': 'dzal', 'ر': 'ra', 'ز': 'zai', 'س': 'sin', 'ش': 'syin', 'ص': 'shad',
    'ض': 'dhad', 'ط': 'tha', 'ظ': 'zha', 'ع': 'ain', 'غ': 'ghain', 'ف': 'fa', 'ق': 'qaf',
    'ك': 'kaf', 'ل': 'lam', 'م': 'mim', 'ن': 'nun', 'و': 'wau', 'ه': 'haa', 'ي': 'ya'
  };

  // --- MESIN SUARA EFEK (BUATAN SENDIRI TANPA FILE MP3) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  function playPopSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine'; // Suara bulat/pop
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playWrongSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sawtooth'; // Suara kasar/buzzer
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }

  // --- FUNGSI MEMANGGIL SUARA HURUF ---
  function putarSuaraHuruf(huruf) {
    let namaFile = namaFileHuruf[huruf];
    if(namaFile) {
      // Akan mencari file di folder asset/suara/alif.mp3 dst.
      let audioHuruf = new Audio(`asset/suara/${namaFile}.mp3`);
      audioHuruf.play().catch(e => console.log("File audio belum diunggah: " + namaFile + ".mp3"));
    }
  }

  let score = 0, timeLeft = 60, currentTarget = '', gameInterval, spawnInterval, isPlaying = false, level = 1, correctThisLevel = 0, levelPassed = false;
  const TARGET_PER_LEVEL = 10, MAX_LEVEL = 10;
  const gameArea = document.getElementById('game-area');

  function setNewTarget() {
    const randomIndex = Math.floor(Math.random() * hurufHijaiyah.length);
    currentTarget = hurufHijaiyah[randomIndex];
    document.getElementById('target-letter').innerText = currentTarget;
    
    // Putar suara huruf secara otomatis saat target baru muncul
    putarSuaraHuruf(currentTarget);
  }

  function createBalloon() {
    if (!isPlaying) return;
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.style.left = (Math.floor(Math.random() * 75) + 10) + '%';
    balloon.style.setProperty('--b-color', balloonColors[Math.floor(Math.random() * balloonColors.length)]);
    const randomSpeed = Math.random() * 4 + 6;
    balloon.style.animationDuration = randomSpeed + 's';

    let letterInside = (Math.random() < 0.3) ? currentTarget : hurufHijaiyah[Math.floor(Math.random() * hurufHijaiyah.length)];
    balloon.innerText = letterInside;

    balloon.addEventListener('pointerdown', () => {
      if(balloon.style.opacity === '0') return; 
      let bX = balloon.offsetLeft + 50, bY = balloon.offsetTop;

      if (letterInside === currentTarget) {
        // JIKA BENAR: Putar Pop Sound, Tambah Skor
        playPopSound();
        score += 10; correctThisLevel++;
        document.getElementById('score-display').innerText = score;
        document.getElementById('correct-display').innerText = correctThisLevel;
        showPopText(bX, bY, pujianBenar[Math.floor(Math.random() * pujianBenar.length)], '#4CAF50');
        
        balloon.style.opacity = '0'; balloon.style.transform = 'scale(0)';
        
        if (correctThisLevel >= TARGET_PER_LEVEL) {
          levelPassed = true; setTimeout(endGame, 300);
        } else {
          setNewTarget();
        }
      } else {
        // JIKA SALAH: Putar Wrong Sound, Getarkan Layar
        playWrongSound();
        document.body.classList.add('shake-screen');
        setTimeout(() => document.body.classList.remove('shake-screen'), 300); // Hapus class setelah 0.3 dtk

        showPopText(bX, bY, "Oops!", '#F44336');
        balloon.style.opacity = '0'; balloon.style.transform = 'scale(0)';
      }
    });

    gameArea.appendChild(balloon);
    setTimeout(() => { if (balloon.parentNode) balloon.remove(); }, randomSpeed * 1000);
  }

  function showPopText(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'pop-anim'; pop.innerText = text; pop.style.color = color;
    pop.style.left = (x - 40) + 'px'; pop.style.top = (y - 40) + 'px';
    document.getElementById('game-area').appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
  }

  function startGame() { level = 1; score = 0; startLevel(); }

  function startLevel() {
    clearInterval(gameInterval); clearInterval(spawnInterval);
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('top-bar').style.display = 'flex';
    
    // Inisialisasi Audio Engine agar tidak diblokir browser
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('bg-music').play().catch(e => console.log(e));

    gameArea.innerHTML = '';
    timeLeft = 60; correctThisLevel = 0; levelPassed = false;
    document.getElementById('score-display').innerText = score;
    document.getElementById('time-display').innerText = timeLeft;
    document.getElementById('level-display').innerText = level;
    document.getElementById('correct-display').innerText = correctThisLevel;
    isPlaying = true;

    setNewTarget();

    gameInterval = setInterval(() => {
      timeLeft--; document.getElementById('time-display').innerText = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
    spawnInterval = setInterval(createBalloon, 1000);
  }

  function endGame() {
    if (!isPlaying) return; isPlaying = false;
    clearInterval(gameInterval); clearInterval(spawnInterval);
    document.getElementById('top-bar').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';
    document.getElementById('final-score').innerText = score;
    levelPassed = correctThisLevel >= TARGET_PER_LEVEL;

    const title = document.getElementById('result-title');
    const message = document.getElementById('result-message');
    const btn = document.getElementById('result-main-btn');

    if (levelPassed && level >= MAX_LEVEL) {
      title.innerText = 'Sempurna! 🏆'; message.innerText = `Semua ${MAX_LEVEL} level selesai.`; btn.innerText = '🔄 MAIN LAGI';
    } else if (levelPassed) {
      title.innerText = `Level ${level} Lulus! 🎉`; message.innerText = `Target terpenuhi.`; btn.innerText = `▶️ LANJUT LEVEL ${level + 1}`;
    } else {
      title.innerText = 'Waktu Habis!'; message.innerText = `Benar ${correctThisLevel}/${TARGET_PER_LEVEL}.`; btn.innerText = '🔄 COBA LAGI DARI LEVEL 1';
    }
  }

  function resetLevel() { score = 0; correctThisLevel = 0; levelPassed = false; startLevel(); }
  function handleResultButton() { if (levelPassed && level < MAX_LEVEL) { level++; startLevel(); } else { level = 1; score = 0; startLevel(); } }
</script>
</body>
</html>
